<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="alternate icon" type="image/png" href="/favicon.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QueueLess — Smart Queue Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://queueless-backend-b2qh.onrender.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      /* ── GLOBAL RESET & HIDE SCROLLBAR ─────────────────────────────────── */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html,
      body,
      *,
      *::before,
      *::after {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      html::-webkit-scrollbar,
      body::-webkit-scrollbar,
      *::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
        background: transparent !important;
      }
      *::-webkit-scrollbar-track,
      *::-webkit-scrollbar-thumb {
        background: transparent !important;
        border: none !important;
      }

      /* ── PREVENT ACCIDENTAL TEXT CURSOR / BLINKING CARET ACROSS APP ── */
      *:not(input):not(textarea):not([contenteditable="true"]) {
        caret-color: transparent !important;
      }

      /* Allow text cursor & caret strictly where needed */
      input:not(:disabled):not([readonly]),
      textarea:not(:disabled):not([readonly]),
      [contenteditable="true"] {
        caret-color: auto !important;
        cursor: text !important;
        user-select: text !important;
        -webkit-user-select: text !important;
      }

      /* Disable cursor on read-only or disabled inputs */
      input:disabled,
      textarea:disabled,
      input[readonly],
      textarea[readonly] {
        cursor: not-allowed !important;
        caret-color: transparent !important;
        user-select: none !important;
      }

      /* Prevent text selection and unwanted I-beam cursors on UI elements */
      button,
      a,
      select,
      option,
      [role="button"],
      .ql-customer-root,
      .ql-customer-root *:not(input):not(textarea):not([contenteditable="true"]) {
        -webkit-user-select: none;
        user-select: none;
      }

      /* Ensure clickable items always show pointer */
      button,
      a,
      select,
      [role="button"],
      [onclick] {
        cursor: pointer !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
